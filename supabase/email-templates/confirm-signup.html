<!doctype html>
<html lang="pt-PT">
<body style="margin:0;padding:0;background:#F6F5FF;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F5FF;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border-radius:20px;padding:32px 28px;font-family:Arial,Helvetica,sans-serif;color:#1F1B4D;">
          <tr>
            <td style="font-size:22px;font-weight:bold;color:#5C4DB1;padding-bottom:16px;">NestKeep</td>
          </tr>
          <tr>
            <td style="font-size:22px;font-weight:bold;line-height:1.3;padding-bottom:12px;">Confirma o teu e-mail</td>
          </tr>
          <tr>
            <td style="font-size:17px;line-height:1.5;padding-bottom:24px;">Bem-vindo(a) ao NestKeep! Toca no botão para confirmar o e-mail <strong>{{ .Email }}</strong>.</td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#5C4DB1;color:#FFFFFF;text-decoration:none;font-size:17px;font-weight:bold;padding:16px 28px;border-radius:14px;">Confirmar e-mail</a>
            </td>
          </tr>
          <tr>
            <td style="font-size:15px;line-height:1.5;color:#6F6AA0;">Se não foste tu, ignora este e-mail.</td>
          </tr>
        </table>
        <p style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#6F6AA0;margin:16px 0 0;">NestKeep · Your home in flow.</p>
      </td>
    </tr>
  </table>
</body>
</html>
